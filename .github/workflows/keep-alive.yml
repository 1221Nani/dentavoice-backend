name: Keep Backends Alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DentaVoice booking backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://dentavoice-backend.onrender.com/health)
          echo "DentaVoice health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::DentaVoice backend returned $STATUS"
          fi

      - name: Ping AdPilot backend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://adpilot-h3um.onrender.com/api/health)
          echo "AdPilot health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::AdPilot backend returned $STATUS"
          fi
